name: Mirror Herdr Core
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mirror.yml']
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: herdr-core-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Verify and commit official binaries
        shell: bash
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          origin=https://releases.herdr.dev/core
          curl --fail --silent --show-error --location --retry 3 "$origin/latest.json" -o "$tmp/manifest.json"
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$tmp/manifest.json")
          if cmp -s "$tmp/manifest.json" upstream-manifest.json; then
            echo "Already mirrored $version"
            exit 0
          fi
          for target in linux-x86_64 linux-aarch64 windows-x86_64; do
            extension=tar.gz
            if [[ "$target" == windows-* ]]; then extension=zip; fi
            asset="herdr-core-$target.$extension"
            url=$(jq -er --arg target "$target" '.targets[$target].url' "$tmp/manifest.json")
            digest=$(jq -er --arg target "$target" '.targets[$target].sha256 | select(test("^[a-f0-9]{64}$"))' "$tmp/manifest.json")
            [[ "$url" == "$origin/$version/$asset" ]]
            curl --fail --silent --show-error --location --retry 3 "$url" -o "$tmp/$asset"
            printf '%s  %s\n' "$digest" "$tmp/$asset" | sha256sum --check
            dest="$tmp/bin/$target"
            mkdir -p "$dest"
            if [[ "$extension" == zip ]]; then
              unzip -q "$tmp/$asset" -d "$dest"
              test -f "$dest/herdr-core.exe"
            else
              tar --extract --gzip --file "$tmp/$asset" --directory "$dest" --no-same-owner --no-same-permissions
              chmod +x "$dest/herdr-core"
            fi
          done
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/herdrdev/herdr-core/master/LICENSE -o "$tmp/LICENSE"
          "$tmp/bin/linux-x86_64/herdr-core" --version | grep -Fx "hc $version"
          rm -rf bin
          mv "$tmp/bin" bin
          cp "$tmp/manifest.json" upstream-manifest.json
          cp "$tmp/LICENSE" LICENSE
          printf '%s\n' "$version" > VERSION
          git add -- bin upstream-manifest.json LICENSE VERSION
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Mirror Herdr Core $version"
          git push origin HEAD:main
